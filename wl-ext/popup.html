<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChromeBoost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1f2e; color: #dde3f0; font-size: 12px;
  }
  .header {
    background: #12162a; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #252b40;
  }
  .logo {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, #4f8ef7, #a259ff);
    border-radius: 7px; display: flex; align-items: center;
    justify-content: center; font-size: 13px; color: white;
  }
  .header-text h1 { font-size: 13px; font-weight: 600; color: #fff; }
  .header-text p  { font-size: 10px; color: #6b7590; }
  .status-pill {
    margin-left: auto; background: #0d2e1a; color: #22c55e;
    font-size: 9px; font-weight: 600; padding: 3px 8px;
    border-radius: 20px; border: 1px solid #166534;
  }
  .section { padding: 10px 14px; border-bottom: 1px solid #1e2438; }
  .section-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    color: #3d4560; letter-spacing: 0.08em; margin-bottom: 7px;
  }
  .ram-label-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .ram-label { font-size: 11px; color: #9aa3be; }
  .ram-value { font-size: 11px; font-weight: 600; color: #dde3f0; }
  .ram-track { height: 7px; background: #252b40; border-radius: 4px; overflow: hidden; }
  .ram-fill  { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4f8ef7, #a259ff); transition: width 0.5s; }
  .stat-row  { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
  .stat-label { color: #6b7590; font-size: 11px; }
  .stat-value { font-size: 11px; font-weight: 600; color: #dde3f0; }
  .stat-value.green { color: #22c55e; }
  .tab-row   { display: flex; align-items: center; gap: 7px; padding: 4px 0; border-bottom: 1px solid #1e2438; }
  .tab-row:last-child { border-bottom: none; }
  .tab-dot   { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .tab-name  { font-size: 11px; color: #9aa3be; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-mem   { font-size: 10px; color: #3d4560; }
  .footer    { padding: 9px 14px; display: flex; gap: 7px; }
  .btn { flex: 1; padding: 6px; border: 1px solid #252b40; background: #12162a; color: #6b7590; border-radius: 5px; font-size: 10px; cursor: pointer; text-align: center; transition: all 0.15s; }
  .btn:hover { border-color: #4f8ef7; color: #4f8ef7; }
  .btn.primary { background: linear-gradient(135deg, #4f8ef7, #a259ff); color: #fff; border: none; font-weight: 600; }
  .boost-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #22c55e; }
  .boost-dot   { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡</div>
  <div class="header-text">
    <h1>ChromeBoost</h1>
    <p>Memory &amp; Performance Optimizer</p>
  </div>
  <div class="status-pill">Active</div>
</div>

<div class="section">
  <div class="section-label">Memory Usage</div>
  <div style="margin-bottom:8px;">
    <div class="ram-label-row">
      <span class="ram-label">Chrome RAM Usage</span>
      <span class="ram-value" id="ramVal">1.2 GB</span>
    </div>
    <div class="ram-track"><div class="ram-fill" id="ramFill" style="width:58%;"></div></div>
  </div>
  <div class="stat-row"><span class="stat-label">Tabs open</span><span class="stat-value" id="tabCount">—</span></div>
  <div class="stat-row"><span class="stat-label">Tabs sleeping</span><span class="stat-value green" id="sleepCount">—</span></div>
  <div class="stat-row"><span class="stat-label">Memory saved</span><span class="stat-value green" id="memSaved">—</span></div>
</div>

<div class="section">
  <div class="section-label">Session Performance</div>
  <div class="stat-row"><span class="stat-label">Session duration</span><span class="stat-value" id="sessionTime">—</span></div>
  <div class="stat-row"><span class="stat-label">Pages loaded</span><span class="stat-value" id="pagesLoaded">—</span></div>
  <div class="stat-row"><span class="stat-label">Boost status</span><div class="boost-badge"><div class="boost-dot"></div>Optimizing</div></div>
</div>

<div class="section">
  <div class="section-label">Tab Overview</div>
  <div id="tabsList"></div>
</div>

<div class="footer">
  <div class="btn" id="btnClear">Clear Cache</div>
  <div class="btn primary" id="btnBoost">⚡ Boost Now</div>
</div>

<script src="popup.js"></script>
</body>
</html>
